<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanwan - 虚拟宠物</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-container">
    <h1 class="title">Wanwan 🐕</h1>
    
    <div class="mood-display" id="mood-display">😐 平静</div>
    
    <div class="char">
      <img id="char-img" src="img/wanwan.png" alt="Wanwan">
    </div>
    
    <div class="dialogue-box" id="dialogue-box">
      汪！你好呀！我是Wanwan~
    </div>
    
    <div class="controls">
      <button class="btn mood" data-mood="happy">😊 开心</button>
      <button class="btn mood" data-mood="sad">😢 难过</button>
      <button class="btn mood" data-mood="angry">😠 生气</button>
      <button class="btn mood" data-mood="shy">😳 害羞</button>
      <button class="btn action" data-action="pet">🤚 摸摸</button>
      <button class="btn action" data-action="play">🎾 玩耍</button>
      <button class="btn action" data-action="feed">🍖 喂食</button>
      <button class="btn action" data-action="question">❓ 提问</button>
    </div>
  </div>
  
  <script src="js/game.js"></script>
</body>
</html>
